<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World!</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="./app.js"></script>
</head>

<body>

    <div class="main_div">
        <div class="main_div2">
            <div class="child_div head_div">
                <h1>Guess The Number</h1>
                <p>Try to guess the number between 1 and 10</p>
            </div>
            <div class="child_div demo_div">
                <h1>DEMO</h1>
                <div class="demo_child">
                    <h2>Target :</h2>
                    <h2 id="demo"></h2>
                </div>
            </div>
            <div class="child_div input_div">
                <input type="number" name="" id="userInput" placeholder="Enter your guess">
            </div>
            <div class="child_div check_div">
                <button class="check_guess" onclick="user()">Check Guess</button>
                <button class="play_again">Play Again</button>
            </div>
            <div class="child_div accuracy_div">
                <h1 class="correct">Correct Guess</h1>
            </div>
            <div class="child_div scores_div">
                <div class="score_child score_child_1">
                    <h3>Current Score</h3>
                    <h2>0</h2>
                </div>
                <div class="score_child score_child_2">
                    <h3>High Score</h3>
                    <h2>0</h2>
                </div>
                <div class="score_child score_child_3">
                    <h3>Remaining Attempts</h3>
                    <h2>0</h2>
                </div>
            </div>
        </div>
    </div>





</body>

</html>
